<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Siswa - Sistem Informasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --white: #ffffff;
        --silver-1: #e8eaee;
        --silver-2: #c8ccd4;
        --silver-3: #a8adb8;
        --gray-1: #8a8f99;
        --gray-2: #5a5f6b;
        --gray-3: #2f333c;
        --gray-4: #1a1d23;
        --border: #e1e4e8;
        --shadow-sm: 0 1px 3px rgba(47, 51, 60, 0.06);
        --shadow-md: 0 8px 24px rgba(47, 51, 60, 0.08);
        --shadow-lg: 0 20px 50px rgba(47, 51, 60, 0.15);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body { min-height: 100%; }

    body {
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        color: var(--gray-3);
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow-x: hidden;
        background: #f0f2f5;
    }

    /* ===== BACKGROUND ===== */
    .bg-layer {
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
            radial-gradient(circle at 20% 20%, rgba(200, 204, 212, 0.45) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(168, 173, 184, 0.35) 0%, transparent 50%),
            radial-gradient(circle at 60% 10%, rgba(232, 234, 238, 0.7) 0%, transparent 45%),
            linear-gradient(135deg, #f5f6f8 0%, #e8eaee 50%, #dfe2e7 100%);
        background-size: 200% 200%, 200% 200%, 200% 200%, 200% 200%;
        animation: gradientShift 18s ease-in-out infinite;
    }

    @keyframes gradientShift {
        0%, 100% { background-position: 0% 0%, 100% 100%, 50% 0%, 0% 0%; }
        50%      { background-position: 100% 100%, 0% 0%, 0% 100%, 100% 100%; }
    }

    .bg-grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
            linear-gradient(rgba(168, 173, 184, 0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(168, 173, 184, 0.08) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        pointer-events: none;
    }

    .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.5;
        z-index: -1;
        pointer-events: none;
    }
    .blob-1 { width: 380px; height: 380px; background: radial-gradient(circle, #d8dbe0 0%, transparent 70%); top: -100px; left: -100px; animation: float1 20s ease-in-out infinite; }
    .blob-2 { width: 320px; height: 320px; background: radial-gradient(circle, #b8bcc4 0%, transparent 70%); bottom: -80px; right: -80px; animation: float2 25s ease-in-out infinite; }
    .blob-3 { width: 260px; height: 260px; background: radial-gradient(circle, #ffffff 0%, transparent 70%); top: 40%; right: 10%; opacity: 0.6; animation: float3 22s ease-in-out infinite; }

    @keyframes float1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%      { transform: translate(60px, 80px) scale(1.1); }
        66%      { transform: translate(-30px, 40px) scale(0.95); }
    }
    @keyframes float2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(-70px, -50px) scale(1.15); }
    }
    @keyframes float3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(40px, -60px) scale(1.2); }
    }

    /* ===== WRAPPER ===== */
    .wrapper {
        width: 100%;
        max-width: 660px;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* ===== CARD ===== */
    .container, .list-container {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        width: 100%;
        border-radius: 20px;
        box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        border: 1px solid rgba(255, 255, 255, 0.5);
        overflow: hidden;
        position: relative;
        animation: cardEnter 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .list-container {
        animation-delay: 0.15s;
    }

    @keyframes cardEnter {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .container::before, .list-container::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #c8ccd4, #ffffff, #c8ccd4, transparent);
        background-size: 200% 100%;
        animation: shimmer 4s linear infinite;
    }

    @keyframes shimmer {
        from { background-position: 200% 0; }
        to   { background-position: -200% 0; }
    }

    /* ===== HEADER ===== */
    .header {
        padding: 30px 40px 24px;
        border-bottom: 1px solid rgba(225, 228, 232, 0.6);
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .header-icon {
        width: 52px; height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #ffffff 0%, #d8dbe0 60%, #b8bcc4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.9),
            inset 0 -1px 0 rgba(168,173,184,0.4),
            0 4px 12px rgba(47, 51, 60, 0.12);
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .header-icon::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.7) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.8s ease;
    }

    .header-icon:hover { transform: rotate(-6deg) scale(1.06); }
    .header-icon:hover::before { transform: translateX(100%); }

    .header-icon svg {
        width: 24px; height: 24px;
        stroke: var(--gray-3);
        stroke-width: 1.8;
        fill: none;
        position: relative;
        z-index: 1;
    }

    .header-text h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--gray-3);
        margin-bottom: 2px;
    }

    .header-text p {
        font-size: 13px;
        color: var(--gray-1);
        font-weight: 400;
    }

    /* ===== FORM ===== */
    form { padding: 30px 40px 34px; }

    .form-group { margin-bottom: 18px; }

    .form-group > label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gray-2);
        margin-bottom: 8px;
    }

    .form-group > label svg {
        width: 13px; height: 13px;
        stroke: var(--gray-1);
        stroke-width: 2;
        fill: none;
    }

    input[type="text"], select, textarea {
        width: 100%;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        font-weight: 400;
        color: var(--gray-3);
        outline: none;
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        font-family: inherit;
        box-shadow: inset 0 1px 2px rgba(47, 51, 60, 0.03);
    }

    input[type="text"]::placeholder, textarea::placeholder {
        color: var(--silver-3);
        font-weight: 300;
    }

    input[type="text"]:hover, select:hover, textarea:hover {
        border-color: var(--silver-2);
        background: rgba(255, 255, 255, 0.95);
    }

    input[type="text"]:focus, select:focus, textarea:focus {
        border-color: var(--gray-3);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(47, 51, 60, 0.08), inset 0 1px 2px rgba(47, 51, 60, 0.03);
        transform: translateY(-1px);
    }

    select {
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8f99' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 14px center;
        background-size: 16px;
        padding-right: 40px;
    }

    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    /* ===== RADIO & CHECKBOX ===== */
    .option-grid { display: flex; flex-wrap: wrap; gap: 10px; }

    .option-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        font-size: 13px;
        font-weight: 500;
        color: var(--gray-2);
        user-select: none;
    }

    .option-item:hover {
        border-color: var(--silver-2);
        background: rgba(255, 255, 255, 0.95);
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(47, 51, 60, 0.06);
    }

    .option-item input {
        appearance: none;
        width: 16px; height: 16px;
        border: 1.5px solid var(--silver-3);
        background: #ffffff;
        cursor: pointer;
        transition: all 0.2s ease;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
    }

    .option-item input[type="radio"] { border-radius: 50%; }
    .option-item input[type="checkbox"] { border-radius: 5px; }

    .option-item input:checked {
        background: var(--gray-3);
        border-color: var(--gray-3);
        animation: pulseCheck 0.3s ease;
    }

    @keyframes pulseCheck {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }

    .option-item input[type="radio"]:checked::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #ffffff;
        transform: translate(-50%, -50%);
    }

    .option-item input[type="checkbox"]:checked::after {
        content: '';
        position: absolute;
        top: 1px; left: 5px;
        width: 4px; height: 9px;
        border: solid #ffffff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .option-item:has(input:checked) {
        border-color: var(--gray-3);
        background: linear-gradient(135deg, #f5f6f8 0%, #e8eaee 100%);
        box-shadow: 0 2px 6px rgba(47, 51, 60, 0.08);
    }

    /* ===== BUTTONS ===== */
    .button-group { display: flex; gap: 12px; margin-top: 26px; }

    button {
        flex: 1;
        padding: 13px 20px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        position: relative;
        overflow: hidden;
    }

    button svg {
        width: 16px; height: 16px;
        stroke-width: 2;
        fill: none;
        transition: transform 0.3s ease;
    }

    .btn-primary {
        background: linear-gradient(135deg, #3a3f48 0%, var(--gray-3) 50%, #1f232a 100%);
        color: var(--white);
        box-shadow: 0 2px 4px rgba(47, 51, 60, 0.2), inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -1px 0 rgba(0,0,0,0.2);
    }

    .btn-primary svg { stroke: var(--white); }

    .btn-primary::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(47, 51, 60, 0.3), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .btn-primary:hover::before { transform: translateX(100%); }
    .btn-primary:hover svg { transform: translateX(2px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
        background: linear-gradient(180deg, #ffffff 0%, #f0f1f3 100%);
        color: var(--gray-2);
        border: 1px solid var(--border);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 3px rgba(47, 51, 60, 0.06);
    }

    .btn-secondary svg { stroke: var(--gray-2); }

    .btn-secondary:hover {
        background: linear-gradient(180deg, #fafbfc 0%, #e8eaed 100%);
        border-color: var(--silver-2);
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(47, 51, 60, 0.1);
    }

    .btn-secondary:hover svg { transform: rotate(-180deg); }
    .btn-secondary:active { transform: translateY(0); }

    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        transform: scale(0);
        animation: rippleAnim 0.6s linear;
        pointer-events: none;
    }
    .btn-secondary .ripple { background: rgba(47, 51, 60, 0.15); }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    /* ============================================ */
    /* ===== DAFTAR DATA SISWA (LIST) ===== */
    /* ============================================ */
    .list-header {
        padding: 24px 32px 18px;
        border-bottom: 1px solid rgba(225, 228, 232, 0.6);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .list-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .list-icon {
        width: 40px; height: 40px;
        border-radius: 11px;
        background: linear-gradient(135deg, #ffffff 0%, #e8eaee 60%, #c8ccd4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.9),
            inset 0 -1px 0 rgba(168,173,184,0.4),
            0 3px 8px rgba(47, 51, 60, 0.1);
        flex-shrink: 0;
    }

    .list-icon svg {
        width: 20px; height: 20px;
        stroke: var(--gray-3);
        stroke-width: 1.8;
        fill: none;
    }

    .list-title h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--gray-3);
        letter-spacing: -0.01em;
        margin-bottom: 2px;
    }

    .list-title p {
        font-size: 12px;
        color: var(--gray-1);
        font-weight: 400;
    }

    .count-badge {
        background: linear-gradient(135deg, #3a3f48 0%, var(--gray-3) 100%);
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 20px;
        box-shadow: 0 2px 6px rgba(47, 51, 60, 0.2), inset 0 1px 0 rgba(255,255,255,0.15);
        min-width: 34px;
        text-align: center;
        transition: transform 0.3s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    .count-badge.bump {
        transform: scale(1.2);
    }

    .list-body {
        padding: 16px 20px 20px;
        max-height: 500px;
        overflow-y: auto;
    }

    .list-body::-webkit-scrollbar { width: 6px; }
    .list-body::-webkit-scrollbar-track { background: transparent; }
    .list-body::-webkit-scrollbar-thumb {
        background: var(--silver-2);
        border-radius: 3px;
    }
    .list-body::-webkit-scrollbar-thumb:hover { background: var(--silver-3); }

    /* Empty state */
    .empty-state {
        padding: 40px 20px;
        text-align: center;
        color: var(--gray-1);
    }

    .empty-state svg {
        width: 44px; height: 44px;
        stroke: var(--silver-3);
        stroke-width: 1.5;
        fill: none;
        margin-bottom: 12px;
        opacity: 0.7;
    }

    .empty-state p {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--gray-2);
        margin-bottom: 4px;
    }

    .empty-state span {
        font-size: 12px;
        color: var(--gray-1);
        font-weight: 400;
    }

    /* Student card */
    .student-card {
        background: linear-gradient(135deg, #ffffff 0%, #fafbfc 100%);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 14px;
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        animation: cardSlide 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        position: relative;
        overflow: hidden;
    }

    .student-card:hover {
        border-color: var(--silver-2);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(47, 51, 60, 0.08);
    }

    .student-card::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: linear-gradient(180deg, var(--silver-2), var(--gray-3));
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .student-card:hover::before { opacity: 1; }

    @keyframes cardSlide {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .student-avatar {
        width: 42px; height: 42px;
        border-radius: 11px;
        background: linear-gradient(135deg, #3a3f48 0%, var(--gray-3) 50%, #1f232a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        flex-shrink: 0;
        box-shadow: 0 3px 8px rgba(47, 51, 60, 0.2), inset 0 1px 0 rgba(255,255,255,0.12);
        letter-spacing: 0.02em;
    }

    .student-info {
        flex: 1;
        min-width: 0;
    }

    .student-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--gray-3);
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .student-meta {
        font-size: 12px;
        color: var(--gray-1);
        font-weight: 400;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .student-meta .dot {
        width: 3px; height: 3px;
        border-radius: 50%;
        background: var(--silver-3);
    }

    .student-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
    }

    .icon-btn {
        width: 32px; height: 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        padding: 0;
        flex: none;
    }

    .icon-btn svg {
        width: 15px; height: 15px;
        stroke: var(--gray-2);
        stroke-width: 2;
        fill: none;
        transition: transform 0.2s ease;
    }

    .icon-btn:hover {
        background: linear-gradient(180deg, #fafbfc 0%, #f0f1f3 100%);
        border-color: var(--silver-2);
        transform: scale(1.05);
    }

    .icon-btn:hover svg {
        transform: scale(1.1);
    }

    .icon-btn.delete:hover {
        border-color: #e5b5b5;
        background: linear-gradient(180deg, #fef5f5 0%, #fdeaea 100%);
    }

    .icon-btn.delete:hover svg {
        stroke: #c26b6b;
    }

    /* ============================================ */
    /* ===== POPUP MODAL ===== */
    /* ============================================ */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(26, 29, 35, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .modal {
        background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
        width: 100%;
        max-width: 460px;
        border-radius: 20px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
        overflow: hidden;
        transform: scale(0.9) translateY(20px);
        opacity: 0;
        transition: transform 0.4s cubic-bezier(0.22, 1.4, 0.36, 1), opacity 0.3s ease;
        position: relative;
    }

    .modal-overlay.active .modal {
        transform: scale(1) translateY(0);
        opacity: 1;
    }

    .modal::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #c8ccd4, #ffffff, #c8ccd4, transparent);
        background-size: 200% 100%;
        animation: shimmer 4s linear infinite;
    }

    .modal-header {
        padding: 26px 28px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--border);
    }

    .modal-icon {
        width: 48px; height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #3a3f48 0%, var(--gray-3) 50%, #1f232a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 12px rgba(47, 51, 60, 0.25), inset 0 1px 0 rgba(255,255,255,0.15);
        animation: successPop 0.5s cubic-bezier(0.22, 1.4, 0.36, 1) 0.15s backwards;
    }

    @keyframes successPop {
        0% { transform: scale(0) rotate(-45deg); }
        60% { transform: scale(1.15) rotate(5deg); }
        100% { transform: scale(1) rotate(0); }
    }

    .modal-icon svg {
        width: 26px; height: 26px;
        stroke: #ffffff;
        stroke-width: 2.5;
        fill: none;
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: drawCheck 0.5s ease 0.5s forwards;
    }

    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    .modal-header-text h2 {
        font-size: 17px;
        font-weight: 600;
        color: var(--gray-3);
        letter-spacing: -0.01em;
        margin-bottom: 3px;
    }

    .modal-header-text p {
        font-size: 12.5px;
        color: var(--gray-1);
        font-weight: 400;
    }

    .modal-body {
        padding: 20px 28px 8px;
        max-height: 50vh;
        overflow-y: auto;
    }

    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb {
        background: var(--silver-2);
        border-radius: 3px;
    }

    .data-item {
        display: flex;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13.5px;
        line-height: 1.5;
        margin-bottom: 6px;
        background: linear-gradient(135deg, #fafbfc 0%, #f5f6f8 100%);
        border: 1px solid rgba(225, 228, 232, 0.6);
        animation: itemSlide 0.4s ease backwards;
    }

    .data-item:nth-child(1) { animation-delay: 0.2s; }
    .data-item:nth-child(2) { animation-delay: 0.26s; }
    .data-item:nth-child(3) { animation-delay: 0.32s; }
    .data-item:nth-child(4) { animation-delay: 0.38s; }
    .data-item:nth-child(5) { animation-delay: 0.44s; }
    .data-item:nth-child(6) { animation-delay: 0.5s; }

    @keyframes itemSlide {
        from { opacity: 0; transform: translateX(-10px); }
        to   { opacity: 1; transform: translateX(0); }
    }

    .data-item .key {
        width: 120px;
        color: var(--gray-1);
        font-weight: 500;
        flex-shrink: 0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding-top: 1px;
    }

    .data-item .val {
        color: var(--gray-3);
        font-weight: 500;
        word-break: break-word;
        flex: 1;
    }

    .modal-footer {
        padding: 16px 28px 24px;
        display: flex;
        gap: 10px;
    }

    .modal-footer button {
        padding: 12px 18px;
        font-size: 13.5px;
    }

    .btn-close {
        background: linear-gradient(180deg, #ffffff 0%, #f0f1f3 100%);
        color: var(--gray-2);
        border: 1px solid var(--border);
        flex: 0.6;
    }

    .btn-close svg { stroke: var(--gray-2); }

    .btn-close:hover {
        background: linear-gradient(180deg, #fafbfc 0%, #e8eaed 100%);
        border-color: var(--silver-2);
    }

    .btn-done {
        background: linear-gradient(135deg, #3a3f48 0%, var(--gray-3) 50%, #1f232a 100%);
        color: var(--white);
        flex: 1;
        box-shadow: 0 2px 4px rgba(47, 51, 60, 0.2), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .btn-done svg { stroke: var(--white); }

    .btn-done:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(47, 51, 60, 0.3), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    /* ===== DETAIL MODAL ===== */
    #detailModal .modal { max-width: 480px; }

    @media (max-width: 520px) {
        body { padding: 20px 12px; }
        form { padding: 22px 22px 26px; }
        .header { padding: 22px 22px 18px; }
        .list-header { padding: 20px 22px 16px; }
        .list-body { padding: 12px 16px 16px; }
        .blob { filter: blur(40px); }
        .modal-header { padding: 22px 22px 18px; }
        .modal-body { padding: 16px 22px 6px; }
        .modal-footer { padding: 14px 22px 22px; }
        .data-item .key { width: 100px; }
        .student-meta { font-size: 11.5px; }
    }
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg-layer"></div>
<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="wrapper">

    <!-- ===== FORM CARD ===== -->
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>
            <div class="header-text">
                <h1>Data Siswa</h1>
                <p>Sistem Informasi Akademik</p>
            </div>
        </div>

        <form id="siswaForm">
            <div class="form-group">
                <label for="nama">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Nama Lengkap
                </label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap siswa" required>
            </div>

            <div class="form-group">
                <label for="nis">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="7" y1="9" x2="11" y2="9"></line><line x1="7" y1="13" x2="15" y2="13"></line><line x1="7" y1="17" x2="13" y2="17"></line></svg>
                    Nomor Induk Siswa
                </label>
                <input type="text" id="nis" placeholder="Masukkan NIS siswa" required>
            </div>

            <div class="form-group">
                <label for="kelas">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                    Kelas
                </label>
                <select id="kelas" required>
                    <option value="">Pilih kelas</option>
                    <option value="X RPL 1">X RPL 1</option>
                    <option value="X RPL 2">X RPL 2</option>
                    <option value="XI RPL 1">XI RPL 1</option>
                    <option value="XI RPL 2">XI RPL 2</option>
                    <option value="XII RPL 1">XII RPL 1</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
                    Jenis Kelamin
                </label>
                <div class="option-grid">
                    <label class="option-item">
                        <input type="radio" name="jk" value="Laki-laki" checked>
                        <span>Laki-laki</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="jk" value="Perempuan">
                        <span>Perempuan</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    Hobi
                </label>
                <div class="option-grid">
                    <label class="option-item">
                        <input type="checkbox" value="Membaca">
                        <span>Membaca</span>
                    </label>
                    <label class="option-item">
                        <input type="checkbox" value="Olahraga">
                        <span>Olahraga</span>
                    </label>
                    <label class="option-item">
                        <input type="checkbox" value="Musik">
                        <span>Musik</span>
                    </label>
                    <label class="option-item">
                        <input type="checkbox" value="Coding">
                        <span>Coding</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="alamat">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    Alamat Lengkap
                </label>
                <textarea id="alamat" placeholder="Masukkan alamat lengkap siswa" required></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="btn-secondary" onclick="resetForm(event)">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                    Reset
                </button>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Simpan Data
                </button>
            </div>
        </form>
    </div>

    <!-- ===== LIST DATA CARD ===== -->
    <div class="list-container">
        <div class="list-header">
            <div class="list-header-left">
                <div class="list-icon">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </div>
                <div class="list-title">
                    <h2>Daftar Siswa Terdaftar</h2>
                    <p>Data tersimpan di browser kamu</p>
                </div>
            </div>
            <div class="count-badge" id="countBadge">0</div>
        </div>

        <div class="list-body" id="listBody">
            <!-- Diisi lewat JS -->
        </div>
    </div>

</div>

<!-- ===== SUCCESS POPUP ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="modal-header-text">
                <h2>Data Berhasil Disimpan</h2>
                <p>Informasi siswa telah tercatat di sistem</p>
            </div>
        </div>

        <div class="modal-body" id="modalBody"></div>

        <div class="modal-footer">
            <button type="button" class="btn-close" onclick="closeModal()">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Tutup
            </button>
            <button type="button" class="btn-done" onclick="closeModalAndReset()">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Selesai
            </button>
        </div>
    </div>
</div>

<!-- ===== DETAIL MODAL ===== -->
<div class="modal-overlay" id="detailOverlay">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </div>
            <div class="modal-header-text">
                <h2>Detail Siswa</h2>
                <p>Informasi lengkap data siswa</p>
            </div>
        </div>

        <div class="modal-body" id="detailBody"></div>

        <div class="modal-footer">
            <button type="button" class="btn-done" onclick="closeDetail()">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Tutup
            </button>
        </div>
    </div>
</div>

<script>
    // ===== STORAGE KEY =====
    const STORAGE_KEY = 'dataSiswaApp';

    // ===== RIPPLE =====
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    });

    // ===== DATA MANAGEMENT =====
    function getData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    function saveData(data) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
            console.warn('Gagal menyimpan data:', e);
        }
    }

    function addData(siswa) {
        const data = getData();
        siswa.id = Date.now();
        siswa.createdAt = new Date().toISOString();
        data.unshift(siswa); // paling baru di atas
        saveData(data);
        renderList();
    }

    function deleteData(id) {
        if (!confirm('Yakin mau hapus data ini?')) return;
        let data = getData();
        data = data.filter(s => s.id !== id);
        saveData(data);
        renderList();
    }

    // ===== RENDER LIST =====
    function renderList() {
        const data = getData();
        const listBody = document.getElementById('listBody');
        const countBadge = document.getElementById('countBadge');

        countBadge.textContent = data.length;
        countBadge.classList.add('bump');
        setTimeout(() => countBadge.classList.remove('bump'), 300);

        if (data.length === 0) {
            listBody.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-6l-2 3h-4l-2-3H2"></path>
                        <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
                    </svg>
                    <p>Belum ada data siswa</p>
                    <span>Silakan isi formulir di atas untuk menambah data</span>
                </div>
            `;
            return;
        }

        listBody.innerHTML = data.map((s, i) => {
            const initial = (s.nama || '?').trim().charAt(0).toUpperCase();
            return `
                <div class="student-card" style="animation-delay: ${i * 0.05}s">
                    <div class="student-avatar">${initial}</div>
                    <div class="student-info">
                        <div class="student-name">${escapeHtml(s.nama)}</div>
                        <div class="student-meta">
                            <span>${escapeHtml(s.nis)}</span>
                            <span class="dot"></span>
                            <span>${escapeHtml(s.kelas)}</span>
                            <span class="dot"></span>
                            <span>${escapeHtml(s.jk)}</span>
                        </div>
                    </div>
                    <div class="student-actions">
                        <button class="icon-btn" type="button" onclick="showDetail(${s.id})" title="Lihat detail">
                            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                        <button class="icon-btn delete" type="button" onclick="deleteData(${s.id})" title="Hapus">
                            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // ===== MODAL HANDLERS =====
    const modalOverlay = document.getElementById('modalOverlay');
    const detailOverlay = document.getElementById('detailOverlay');

    function openModal() {
        modalOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
        document.body.style.overflow = '';
    }

    function closeModalAndReset() {
        closeModal();
        document.getElementById('siswaForm').reset();
    }

    function showDetail(id) {
        const data = getData();
        const s = data.find(x => x.id === id);
        if (!s) return;

        const tgl = s.createdAt ? new Date(s.createdAt).toLocaleString('id-ID', {
            day: '2-digit', month: 'long', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        }) : '-';

        document.getElementById('detailBody').innerHTML = `
            <div class="data-item"><span class="key">Nama</span><span class="val">${escapeHtml(s.nama)}</span></div>
            <div class="data-item"><span class="key">NIS</span><span class="val">${escapeHtml(s.nis)}</span></div>
            <div class="data-item"><span class="key">Kelas</span><span class="val">${escapeHtml(s.kelas)}</span></div>
            <div class="data-item"><span class="key">Jenis Kelamin</span><span class="val">${escapeHtml(s.jk)}</span></div>
            <div class="data-item"><span class="key">Hobi</span><span class="val">${escapeHtml(s.hobi)}</span></div>
            <div class="data-item"><span class="key">Alamat</span><span class="val">${escapeHtml(s.alamat)}</span></div>
            <div class="data-item"><span class="key">Disimpan</span><span class="val">${tgl}</span></div>
        `;

        detailOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
        detailOverlay.classList.remove('active');
        document.body.style.overflow = '';
    }

    // Tutup modal kalau klik backdrop
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
    detailOverlay.addEventListener('click', e => { if (e.target === detailOverlay) closeDetail(); });

    // Tutup pakai Esc
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if (modalOverlay.classList.contains('active')) closeModal();
            if (detailOverlay.classList.contains('active')) closeDetail();
        }
    });

    // ===== SUBMIT FORM =====
    document.getElementById('siswaForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const nama = document.getElementById('nama').value.trim();
        const nis = document.getElementById('nis').value.trim();
        const kelas = document.getElementById('kelas').value;
        const alamat = document.getElementById('alamat').value.trim();
        const jk = document.querySelector('input[name="jk"]:checked').value;

        const hobiChecked = document.querySelectorAll('.option-grid input[type="checkbox"]:checked');
        const hobiArr = Array.from(hobiChecked).map(c => c.value);
        const hobi = hobiArr.length ? hobiArr.join(', ') : '-';

        // Simpan ke localStorage
        addData({ nama, nis, kelas, jk, hobi, alamat });

        // Isi modal
        document.getElementById('modalBody').innerHTML = `
            <div class="data-item"><span class="key">Nama</span><span class="val">${escapeHtml(nama)}</span></div>
            <div class="data-item"><span class="key">NIS</span><span class="val">${escapeHtml(nis)}</span></div>
            <div class="data-item"><span class="key">Kelas</span><span class="val">${escapeHtml(kelas)}</span></div>
            <div class="data-item"><span class="key">Jenis Kelamin</span><span class="val">${escapeHtml(jk)}</span></div>
            <div class="data-item"><span class="key">Hobi</span><span class="val">${escapeHtml(hobi)}</span></div>
            <div class="data-item"><span class="key">Alamat</span><span class="val">${escapeHtml(alamat)}</span></div>
        `;

        openModal();
    });

    // Reset form
    function resetForm(e) {
        if (e) e.preventDefault();
        document.getElementById('siswaForm').reset();
    }

    // ===== INIT =====
    renderList();
</script>

</body>
</html>
